name = "convx-discord-assistant"
main = "worker.js"
compatibility_date = "2025-12-01"

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[vars]
PRIMARY_MODEL_PROVIDER = "openrouter"
OPENROUTER_MODEL = "liquid/lfm-2.5-2.6b:free"
GROQ_QWEN_MODEL = "qwen/qwen3.8-27b"
GROQ_GPT_OSS_120B_MODEL = "openai/gpt-oss-120b"
GROQ_GPT_OSS_20B_MODEL = "openai/gpt-oss-20b"
MISTRAL_MODEL = "ministral-14b-2512"
GROQ_VISION_ENABLED = "false"
BOT_USER_ID = "1561087820372644042"
GUILD_ID = "1530241653351256134"
TARGET_CHANNEL_ID = "1530567706754158843"
ADMIN_ROLE_IDS = "1530567627783540799"
ADMIN_USER_IDS = "856033880405573632"

[[d1_databases]]
binding = "DB"
database_name = "convx-discord-assistant"
database_id = "9da42b8b-4129-40bf-b19a-d76acb7ee801"

[[durable_objects.bindings]]
name = "DISCORD_GATEWAY"
class_name = "DiscordGateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiscordGateway"]
